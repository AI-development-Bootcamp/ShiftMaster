name: Production CI/CD

on:
  push:
    branches:
      - production

jobs:
  server:
    name: Server - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint -w server

      - name: Run type check
        run: npm run type-check -w server

      - name: Run tests
        run: npm run test -w server
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w server

      - name: Deploy Server
        run: |
