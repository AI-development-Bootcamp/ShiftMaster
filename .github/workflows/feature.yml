name: Feature CI/CD

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'feature/**'
jobs:
  server:
    name: Server - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w server

      - name: Run type check
        run: npm run type-check -w server

      - name: Run tests
        run: npm run test -w server
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w server

      - name: Deploy Server to Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d5mgvcngi27c739j62b0?key=r2fBxqE-yQo"

  client:
    name: Client - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w client

      - name: Run type check
        run: npm run type-check -w client

      - name: Run tests
        run: npm run test -w client
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w client

      - name: Deploy Client to Render
        run: |
          echo "🚀 Deploying client to Render..."
          # Render Static Sites auto-deploy via GitHub integration
          # This step ensures deployment happens after CI passes
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_CLIENT_SERVICE_ID" ]; then
            curl -X POST "https://api.render.com/v1/services/$RENDER_CLIENT_SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}' \
              -f -s -o /dev/null && echo "✅ Render deployment triggered successfully" || echo "⚠️  Render API call failed (service may auto-deploy via GitHub integration)"
          else
            echo "⚠️  Render secrets not configured - relying on GitHub integration for auto-deploy"
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_CLIENT_SERVICE_ID: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}

  admin:
    name: Admin - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w admin

      - name: Run type check
        run: npm run type-check -w admin

      - name: Run tests
        run: npm run test -w admin
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w admin

      - name: Deploy Admin to Render
        run: |
          echo "🚀 Deploying admin to Render..."
          # Render Static Sites auto-deploy via GitHub integration
          # This step ensures deployment happens after CI passes
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_ADMIN_SERVICE_ID" ]; then
            curl -X POST "https://api.render.com/v1/services/$RENDER_ADMIN_SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}' \
              -f -s -o /dev/null && echo "✅ Render deployment triggered successfully" || echo "⚠️  Render API call failed (service may auto-deploy via GitHub integration)"
          else
            echo "⚠️  Render secrets not configured - relying on GitHub integration for auto-deploy"
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_ADMIN_SERVICE_ID: ${{ secrets.RENDER_ADMIN_SERVICE_ID }}

  shared:
    name: Shared - Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w shared

      - name: Run type check
        run: npm run type-check -w shared

      - name: Run tests
        run: npm run test -w shared
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w shared
