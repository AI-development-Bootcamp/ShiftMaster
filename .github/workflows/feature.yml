name: Feature CI/CD

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'feature/**'
jobs:
  server:
    name: Server - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared
    environment: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w server

      - name: Run type check
        run: npm run type-check -w server

      - name: Run tests
        run: npm run test -w server
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w server

      - name: Deploy Server to Render
        run: |
          echo "🚀 Deploying server to Render..."
          if [ -n "$RENDER_DEPLOY_URL_SERVER" ]; then
            curl -X POST "$RENDER_DEPLOY_URL_SERVER" \
              -f -s -o /dev/null && echo "✅ Render deployment triggered successfully" || (echo "⚠️  Render API call failed" && exit 1)
          else
            echo "⚠️  Render deploy URL not configured - deployment skipped"
          fi
        env:
          RENDER_DEPLOY_URL_SERVER: ${{ secrets.RENDER_DEPLOY_URL_SERVER }}

  client:
    name: Client - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared
    environment: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w client

      - name: Run type check
        run: npm run type-check -w client

      - name: Run tests
        run: npm run test -w client
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w client

      - name: Deploy Client to Render
        run: |
          echo "🚀 Deploying client to Render..."
          if [ -n "$RENDER_DEPLOY_URL_CLIENT" ]; then
            curl -X POST "$RENDER_DEPLOY_URL_CLIENT" \
              -f -s -o /dev/null && echo "✅ Render deployment triggered successfully" || (echo "⚠️  Render API call failed" && exit 1)
          else
            echo "⚠️  Render deploy URL not configured - deployment skipped"
          fi
        env:
          RENDER_DEPLOY_URL_CLIENT: ${{ secrets.RENDER_DEPLOY_URL_CLIENT }}

  admin:
    name: Admin - Test, Lint & Deploy
    runs-on: ubuntu-latest
    needs: shared
    environment: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w admin

      - name: Run type check
        run: npm run type-check -w admin

      - name: Run tests
        run: npm run test -w admin
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w admin

      - name: Deploy Admin to Render
        run: |
          echo "🚀 Deploying admin to Render..."
          if [ -n "$RENDER_DEPLOY_URL_ADMIN" ]; then
            curl -X POST "$RENDER_DEPLOY_URL_ADMIN" \
              -f -s -o /dev/null && echo "✅ Render deployment triggered successfully" || (echo "⚠️  Render API call failed" && exit 1)
          else
            echo "⚠️  Render deploy URL not configured - deployment skipped"
          fi
        env:
          RENDER_DEPLOY_URL_ADMIN: ${{ secrets.RENDER_DEPLOY_URL_ADMIN }}

  shared:
    name: Shared - Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -w shared

      - name: Run type check
        run: npm run type-check -w shared

      - name: Run tests
        run: npm run test -w shared
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build -w shared
