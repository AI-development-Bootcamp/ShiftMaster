name: CI

on:
  pull_request:

jobs:
  server:
    name: Server - Test & Lint
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared module
        run: npm run build -w shared

      - name: Run linter
        run: npm run lint -w server

      - name: Run type check
        run: npm run type-check -w server

      - name: Run tests
        run: npm run test -w server
        env:
          NODE_ENV: test

  client:
    name: Client - Test & Lint
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared module
        run: npm run build -w shared

      - name: Run linter
        run: npm run lint -w client

      - name: Run type check
        run: npm run type-check -w client

      - name: Run tests
        run: npm run test -w client
        env:
          NODE_ENV: test

  admin:
    name: Admin - Test & Lint
    runs-on: ubuntu-latest
    needs: shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared module
        run: npm run build -w shared

      - name: Run linter
        run: npm run lint -w admin

      - name: Run type check
        run: npm run type-check -w admin

      - name: Run tests
        run: npm run test -w admin
        env:
          NODE_ENV: test

  shared:
    name: Shared - Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared module
        run: npm run build -w shared

      - name: Run linter
        run: npm run lint -w shared

      - name: Run type check
        run: npm run type-check -w shared

      - name: Run tests
        run: npm run test -w shared
        env:
          NODE_ENV: test
